; sferic-tab5 — M5Stack Tab5 (ESP32-P4) fleet station. ADR-0013.
; ESP32-P4 needs the pioarduino platform fork (the official espressif32
; platform has no P4 support yet). Radio is a separate ESP32-C6-MINI over
; esp_hosted / esp_wifi_remote.

[env:spike]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Unified
