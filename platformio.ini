; sferic-tab5 — M5Stack Tab5 (ESP32-P4) fleet station. ADR-0013.
; ESP32-P4 needs the pioarduino platform fork (official espressif32 has no P4).

[platformio]
boards_dir = boards

; --- radio / toolchain spike (arduino only, platform 54.x) ---
[env:spike]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:extra_scripts/fix_esp_ipa.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter = -<*> +<../attic/spike_radio.cpp>
lib_deps =
    m5stack/M5Unified

; --- camera bring-up: hybrid arduino+espidf so the IDF component manager can
;     pull esp_video via the M5 Tab5 BSP, while keeping the Arduino / M5Unified
;     API for the sferic shared code (ADR-0013 §2 -> framework decision: espidf).
[env:cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = espidf
board = m5stack-tab5-p4
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:extra_scripts/fix_esp_ipa.py
build_flags =
    -DBOARD_HAS_PSRAM
; Pure ESP-IDF for the camera spike — M5Unified's IDF-i2c-driver clashes with
; the BSP's espressif__i2c_bus. The hybrid (arduino+espidf) question for the
; real firmware is an ADR-0013 §4 item. src/ has only spike_cam.cpp.
